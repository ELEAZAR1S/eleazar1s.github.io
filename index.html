<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Industrial Park — Cartagena de Indias</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  /* Backgrounds */
  --cream:     #F5F0E6;
  --cream2:    #EDE5D5;
  --white:     #FEFCF8;
  --card:      #FFFFFF;
  --card2:     #F9F6F0;

  /* Forest green palette */
  --forest:    #1E4D2F;
  --moss:      #2E7D4F;
  --sage:      #5A9970;
  --sage-lt:   #A8CBB2;
  --mint:      #D6EAD9;
  --mint-lt:   #EBF5EC;

  /* Warm sand palette */
  --sand:      #B5834A;
  --sand-md:   #D4A96A;
  --sand-lt:   #F0DFC0;
  --sand-xlt:  #FAF2E5;

  /* Terra/warm red for negatives */
  --terra:     #9B4A2E;
  --terra-lt:  #F0D5C8;

  /* Sky/water */
  --sky:       #3A7BA8;
  --sky-lt:    #C8DFF0;

  /* Text */
  --text:      #18281C;
  --text2:     #3D5942;
  --text3:     #7A9A80;
  --text4:     #A8C0AD;

  /* Borders */
  --border:    #DDD5C5;
  --border2:   #C8BC9E;

  /* Utility */
  --up:        #2E7D4F;
  --down:      #9B4A2E;
  --stable:    #8A7A5A;
  --r:         10px;
  --rl:        16px;
  --rx:        24px;
}

html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  line-height: 1.65;
  overflow-x: hidden;
}

/* ── ESTILOS DEL HERO BANNER CON IMAGEN ── */
.hero-banner {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-banner-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background: url('ChatGPT Image 19 may 2026, 11_33_39.png') center/cover no-repeat;
  z-index: -2;
  will-change: opacity, transform;
  transition: opacity 0.1s linear;
}

.hero-banner-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(30, 77, 47, 0.4) 0%, rgba(245, 240, 230, 0.9) 100%);
  z-index: -1;
}

.hero-banner-content {
  text-align: center;
  color: var(--white);
  padding: 0 2rem;
  z-index: 1;
}

.hero-banner-content h1 {
  color: var(--white);
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

/* ── TYPOGRAPHY ── */
h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.01em; }
h1 { font-size: clamp(36px, 5vw, 64px); font-weight: 900; line-height: 1.08; color: var(--forest); }
h1 em { font-style: italic; color: var(--moss); }
h2.sec-h { font-size: clamp(26px, 3.5vw, 40px); font-weight: 700; color: var(--forest); margin-bottom: 12px; line-height: 1.15; }
.mono { font-family: 'DM Mono', monospace; }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(254,252,248,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2.5rem; height: 62px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}
.nav-leaf {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
@keyframes breathe { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--moss); animation: breathe 3s infinite;
  margin-left: 2px;
}
.nav-links { display: flex; gap: 2px; list-style: none; }
.nav-links a {
  color: var(--text3); text-decoration: none;
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 7px 13px; border-radius: 7px;
  transition: all 0.2s;
}
.nav-links a:hover { color: var(--forest); background: var(--mint-lt); }
.nav-links a.act { color: var(--moss); background: var(--mint); font-weight: 700; }

/* ── HERO ── */
.hero {
  padding: 96px 2.5rem 72px;
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
}
@media(max-width:860px){ .hero{grid-template-columns:1fr;} .hero-visual{display:none;} }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em;
  color: var(--moss); text-transform: uppercase;
  padding: 6px 14px; border-radius: 20px;
  background: var(--mint); border: 1px solid var(--sage-lt);
  margin-bottom: 24px;
}
.hero-sub {
  font-size: 15px; color: var(--text2);
  max-width: 480px; line-height: 1.75;
  margin-top: 20px; margin-bottom: 44px;
  font-weight: 400;
}
.kpi-strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.kpi {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--rl); padding: 22px 20px;
  border-top: 3px solid var(--mint);
}
.kpi.accent-kpi { border-top-color: var(--moss); }
.kpi-lbl {
  font-family: 'DM Mono', monospace; font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--text3); margin-bottom: 10px;
}
.kpi-val { font-size: 28px; font-weight: 700; color: var(--forest); line-height: 1; font-family: 'Playfair Display', serif; }
.kpi-val sup { font-size: 12px; font-weight: 400; color: var(--text3); font-family: 'DM Mono', monospace; }
.kpi-note { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--sage); margin-top: 6px; }

/* Hero visual */
.hero-visual {
  display: flex; flex-direction: column; gap: 14px;
}
.hv-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--rl);
  padding: 18px 20px; display: flex; align-items: center; gap: 14px;
}
.hv-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.hv-icon.g { background: var(--mint); }
.hv-icon.s { background: var(--sand-xlt); }
.hv-icon.t { background: var(--terra-lt); }
.hv-icon.b { background: var(--sky-lt); }
.hv-label { font-size: 12px; font-weight: 600; color: var(--forest); margin-bottom: 2px; }
.hv-val { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }

/* ── SECTIONS ── */
section {
  max-width: 1200px; margin: 0 auto;
  padding: 88px 2.5rem;
  border-top: 1px solid var(--border);
}
.sec-tag {
  font-family: 'DM Mono', monospace; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.18em;
  color: var(--moss); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.sec-tag::before {
  content: ''; width: 20px; height: 2px;
  background: var(--sage-lt); border-radius: 1px;
}
.sec-p {
  font-size: 15px; color: var(--text2);
  max-width: 620px; line-height: 1.8;
  margin-bottom: 48px; font-weight: 400;
}

/* ── COMPANY CARDS ── */
.co-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 16px; }
.co-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--rx); overflow: hidden; cursor: pointer;
  transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
}
.co-card:hover { box-shadow: 0 8px 32px rgba(30,77,47,.1); transform: translateY(-3px); border-color: var(--sage-lt); }
.co-card.open { border-color: var(--sage); box-shadow: 0 8px 32px rgba(30,77,47,.12); }
.card-stripe { height: 4px; }
.stripe-af { background: linear-gradient(90deg, var(--moss), var(--sage-lt)); }
.stripe-ar { background: linear-gradient(90deg, var(--sand), var(--sand-lt)); }
.stripe-co { background: linear-gradient(90deg, var(--terra), var(--terra-lt)); }
.stripe-re { background: linear-gradient(90deg, var(--sky), var(--sky-lt)); }
.ch { padding: 22px 22px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11.5px; flex-shrink: 0; font-family: 'DM Mono', monospace; letter-spacing: 0.02em; }
.icon.af { background: var(--mint); color: var(--forest); }
.icon.ar { background: var(--sand-xlt); color: var(--sand); }
.icon.co { background: var(--terra-lt); color: var(--terra); }
.icon.re { background: var(--sky-lt); color: var(--sky); }
.co-info { flex: 1; }
.co-name { font-size: 15px; font-weight: 700; color: var(--forest); margin-bottom: 3px; line-height: 1.2; font-family: 'Playfair Display', serif; }
.co-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.chevron { font-size: 14px; color: var(--text4); transition: transform 0.3s, color 0.2s; margin-top: 2px; }
.co-card.open .chevron { transform: rotate(180deg); color: var(--moss); }
.mets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 18px 22px 22px; }
.ms { background: var(--card2); border-radius: 10px; padding: 14px; border: 1px solid var(--border); }
.ms-l { font-family: 'DM Mono', monospace; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); margin-bottom: 6px; }
.ms-v { font-size: 21px; font-weight: 700; color: var(--forest); line-height: 1; font-family: 'Playfair Display', serif; }
.ms-v span { font-size: 10px; font-weight: 400; color: var(--text3); font-family: 'DM Mono', monospace; }
.detail { display: none; padding: 0 22px 24px; }
.co-card.open .detail { display: block; }
.div { height: 1px; background: var(--border); margin-bottom: 18px; }
.dtag { font-family: 'DM Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text3); margin-bottom: 12px; margin-top: 16px; }
.vlist { display: flex; flex-direction: column; gap: 8px; }
.vi { display: flex; gap: 12px; align-items: flex-start; }
.vn { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--moss); min-width: 130px; flex-shrink: 0; padding-top: 2px; font-weight: 500; }
.vd { font-size: 12.5px; color: var(--text2); line-height: 1.6; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tag { font-family: 'DM Mono', monospace; font-size: 9px; padding: 4px 9px; border-radius: 5px; background: var(--cream2); color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; border: 1px solid var(--border); }
.tag.g { background: var(--mint); color: var(--forest); border-color: var(--sage-lt); }
.tag.a { background: var(--sand-xlt); color: var(--sand); border-color: var(--sand-lt); }
.tag.r { background: var(--terra-lt); color: var(--terra); border-color: #dbbdad; }
.tag.b { background: var(--sky-lt); color: var(--sky); border-color: #b0cde0; }

/* ── ECONOMY REDIRECT ── */
.eco-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--rx); padding: 72px 48px; text-align: center;
  background-image: radial-gradient(circle at 60% 0%, var(--sand-xlt) 0%, transparent 55%);
}
.eco-icon-wrap { width: 76px; height: 76px; border-radius: 20px; background: var(--sand-xlt); border: 1px solid var(--sand-lt); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 34px; }
.eco-h { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: var(--forest); margin-bottom: 14px; }
.eco-p { font-size: 14px; color: var(--text2); margin-bottom: 36px; line-height: 1.8; max-width: 440px; margin-left: auto; margin-right: auto; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--forest); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 13px; padding: 13px 30px; border-radius: 9px; text-decoration: none; letter-spacing: 0.02em; transition: all 0.2s; }
.btn:hover { background: var(--moss); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(30,77,47,.25); }
.btn svg { width: 14px; height: 14px; }

/* ── PREDICTIONS ── */
.pred-box {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--rx);
  padding: 88px 48px; text-align: center; position: relative; overflow: hidden;
}
.pred-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.5; pointer-events: none; }
.pred-inner { position: relative; z-index: 1; }
.pred-lbl { display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--moss); background: var(--mint); border: 1px solid var(--sage-lt); padding: 5px 16px; border-radius: 20px; margin-bottom: 26px; }
.pred-h { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--forest); margin-bottom: 14px; }
.pred-p { font-size: 14px; color: var(--text2); max-width: 420px; margin: 0 auto; line-height: 1.8; }
.prog-wrap { margin: 40px auto 0; max-width: 340px; }
.prog-meta { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-bottom: 8px; }
.prog-track { height: 4px; background: var(--cream2); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; width: 38%; background: linear-gradient(90deg, var(--moss), var(--sage)); border-radius: 2px; animation: prog 4s ease-in-out infinite; }
@keyframes prog { 0%,100%{width:30%;opacity:.7} 50%{width:48%;opacity:1} }
.pred-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 32px; }
.pchip { font-family: 'DM Mono', monospace; font-size: 10px; padding: 5px 12px; border-radius: 20px; background: var(--card2); color: var(--text2); border: 1px solid var(--border); letter-spacing: 0.06em; }

/* ── MARKET ── */
.market-row { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; margin-bottom: 24px; }
@media(max-width:820px){ .market-row{grid-template-columns:1fr;} }
.mbox { background: var(--card); border: 1px solid var(--border); border-radius: var(--rx); overflow: hidden; }
.mbox-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--card2); }
.mbox-title { font-size: 13px; font-weight: 700; color: var(--forest); }
.mbox-meta { font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.mbox-meta::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--moss); animation: breathe 3s infinite; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--cream); }
th { font-family: 'DM Mono', monospace; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); padding: 11px 16px; text-align: left; font-weight: 500; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--cream); }
.rname { font-size: 12.5px; font-weight: 600; color: var(--forest); }
.rsrc { font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text3); margin-top: 2px; }
.pricecell { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--text); }
.trd { display: inline-flex; align-items: center; gap: 4px; font-family: 'DM Mono', monospace; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.trd.up { background: var(--mint); color: var(--forest); }
.trd.dn { background: var(--terra-lt); color: var(--terra); }
.trd.st { background: var(--sand-xlt); color: var(--stable); }
.trd.co { background: var(--cream2); color: var(--text3); }
.chart-box { padding: 22px; }
.ch-title { font-size: 13px; font-weight: 700; color: var(--forest); margin-bottom: 4px; }
.ch-sub { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--text3); margin-bottom: 16px; }
.legrow { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.legit { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text2); }
.legsq { width: 10px; height: 10px; border-radius: 3px; }

.vol-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(192px, 1fr)); gap: 12px; margin-top: 28px; }
.vc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; border-left: 3px solid var(--moss); }
.vc.am { border-left-color: var(--sand); }
.vc.co { border-left-color: var(--terra); }
.vc.sk { border-left-color: var(--sky); }
.vc-co { font-family: 'DM Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text3); margin-bottom: 6px; }
.vc-r { font-size: 13px; font-weight: 600; color: var(--forest); margin-bottom: 6px; }
.vc-q { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--moss); letter-spacing: -0.01em; }
.vc.am .vc-q { color: var(--sand); }
.vc.co .vc-q { color: var(--terra); }
.vc.sk .vc-q { color: var(--sky); }
.vc-p { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 4px; }

/* ── ML SECTION ── */
.ml-kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 44px; }
.ml-kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--rl); padding: 20px 18px; border-top: 3px solid var(--mint); }
.ml-kpi.best { border-top-color: var(--moss); background: var(--mint-lt); }
.ml-kpi-l { font-family: 'DM Mono', monospace; font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--text3); margin-bottom: 8px; }
.ml-kpi-v { font-size: 26px; font-weight: 700; color: var(--forest); line-height: 1; font-family: 'Playfair Display', serif; }
.ml-kpi-v span { font-size: 11px; font-weight: 400; color: var(--text3); font-family: 'DM Mono', monospace; }
.ml-kpi-n { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--sage); margin-top: 5px; }
.ml-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media(max-width:860px){ .ml-2col{grid-template-columns:1fr;} }
.ml-2col.one-col{grid-template-columns:1fr;}
.ml-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media(max-width:900px){ .ml-3col{grid-template-columns:1fr;} }
.ml-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--rx); overflow: hidden; }
.ml-box-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; background: var(--card2); }
.ml-box-title { font-size: 13.5px; font-weight: 700; color: var(--forest); line-height: 1.3; font-family: 'Playfair Display', serif; }
.ml-box-badge { font-family: 'DM Mono', monospace; font-size: 9px; padding: 4px 9px; border-radius: 4px; background: var(--cream2); color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; flex-shrink: 0; border: 1px solid var(--border); }
.ml-box-badge.g { background: var(--mint); color: var(--forest); border-color: var(--sage-lt); }
.ml-box-badge.a { background: var(--sand-xlt); color: var(--sand); border-color: var(--sand-lt); }
.ml-box-body { padding: 22px; }
.ml-box-desc { font-size: 13px; color: var(--text2); line-height: 1.8; margin-bottom: 18px; }
.ml-insight { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.ml-insight-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); flex-shrink: 0; margin-top: 6px; }
.ml-insight-dot.a { background: var(--sand); }
.ml-insight-dot.r { background: var(--terra); }
.ml-insight-dot.s { background: var(--sky); }
.ml-insight-txt { font-size: 12.5px; color: var(--text2); line-height: 1.65; }
.ml-insight-txt strong { color: var(--forest); font-weight: 600; }
.model-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }

<!-- ═══ HERO BANNER CON IMAGEN Y DIFUMINADO (CORRECTAMENTE UBICADO AQUÍ) ═══ -->
<div class="hero-banner" id="heroBanner">
  <div class="hero-banner-bg" id="heroBg"></div>
  <div class="hero-banner-overlay"></div>
  <div class="hero-banner-content">
    <h1>Eco Industrial Park</h1>
    <p class="mono" style="color: var(--sand-lt); margin-top: 10px;">Cartagena de Indias</p>
  </div>
</div>

<!-- ═══ SCRIPT DE JS PARA EL EFECTO SCROLL ═══ -->
<script>
  window.addEventListener('scroll', function() {
    const heroBg = document.getElementById('heroBg');
    const heroBanner = document.getElementById('heroBanner');
    const bannerHeight = heroBanner.offsetHeight;
    const scrollPosition = window.scrollY;

    if (scrollPosition <= bannerHeight) {
      let opacity = 1 - (scrollPosition / bannerHeight);
      heroBg.style.opacity = opacity;
    } else {
      heroBg.style.opacity = 0;
    }
  });
</script>
